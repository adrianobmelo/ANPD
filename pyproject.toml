[project]
name = "estudo"
version = "0.1.0"
description = "Registro de itens Cebraspe e motor de saldo para o concurso da ANPD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
estudo = "estudo.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["estudo"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "estudo/_migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
